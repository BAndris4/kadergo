<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaderGo - Помічник ДПС</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-modal">
    <!-- Header: Brand + Version + Window Controls (Reload & Close) -->
    <header class="modal-header">
      <div class="brand-wrap">
        <img src="icons/icon48.png" width="22" height="22" class="brand-icon" alt="KaderGo">
        <span class="brand-title"><span class="brand-teal">Kader</span><span class="brand-amber">Go</span></span>
        <div class="header-divider"></div>
        <div class="version-pill" id="versionBadge">v2.0.0</div>
      </div>
      <div class="header-controls">
        <button id="reloadHeaderBtn" class="icon-btn" title="Оновити розширення з папки (Reload)" type="button">
          <!-- Heroicon: arrow-path -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
          </svg>
        </button>
        <button id="closeBtn" class="icon-btn" title="Закрити" type="button">
          <!-- Heroicon: x-mark -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Animated top shimmer line -->
    <div class="shimmer-line"></div>

    <div class="modal-body">
      <!-- Concise Feature List (No bulky text, clean single-line rows, fully readable) -->
      <div class="features-card">
        <div class="feature-item">
          <div class="feature-icon-box teal">
            <!-- Heroicon: arrow-down-tray -->
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
            </svg>
          </div>
          <span class="feature-name">Щоденна виручка</span>
          <span class="micro-badge">РРО</span>
        </div>

        <div class="feature-item">
          <div class="feature-icon-box amber">
            <!-- Heroicon: book-open -->
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
            </svg>
          </div>
          <span class="feature-name">Книга доходів (ЄП та ЗС)</span>
          <span class="micro-badge highlight">Excel</span>
        </div>

        <div class="feature-item">
          <div class="feature-icon-box teal">
            <!-- Heroicon: squares-plus -->
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13.5 16.875h3.375m0 0h3.375m-3.375 0V13.5m0 3.375v3.375M6 10.5h2.25a2.25 2.25 0 0 0 2.25-2.25V6a2.25 2.25 0 0 0-2.25-2.25H6A2.25 2.25 0 0 0 3.75 6v2.25A2.25 2.25 0 0 0 6 10.5Zm0 9.75h2.25A2.25 2.25 0 0 0 10.5 18v-2.25a2.25 2.25 0 0 0-2.25-2.25H6a2.25 2.25 0 0 0-2.25 2.25V18A2.25 2.25 0 0 0 6 20.25Zm9.75-9.75H18a2.25 2.25 0 0 0 2.25-2.25V6A2.25 2.25 0 0 0 18 3.75h-2.25A2.25 2.25 0 0 0 13.5 6v2.25a2.25 2.25 0 0 0 2.25 2.25Z" />
            </svg>
          </div>
          <span class="feature-name">Зведення всіх кас</span>
          <span class="micro-badge">Всі РРО</span>
        </div>
      </div>

      <!-- Live Connection / Radar Status -->
      <div class="tab-status-card" id="tabStatusCard">
        <div class="beacon-wrap">
          <span class="beacon-wave" id="beaconWave"></span>
          <span class="beacon-core" id="beaconCore"></span>
        </div>
        <div class="status-info">
          <span class="status-domain">cabinet.tax.gov.ua</span>
          <span class="status-label" id="statusLabel">Підключення...</span>
        </div>
      </div>

      <!-- Action 1: Open Cabinet -->
      <button type="button" class="open-cabinet-btn" id="openCabinetBtn">
        <!-- Heroicon: arrow-top-right-on-square -->
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
        </svg>
        <span>Відкрити кабінет платника</span>
      </button>

      <!-- Danger Action: Delete Extension -->
      <button id="uninstallBtn" class="danger-btn" type="button" title="Видалити розширення з Chrome">
        <!-- Heroicon: trash -->
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
        </svg>
        <span>Видалити розширення з Chrome</span>
      </button>
    </div>

    <!-- Footer -->
    <footer class="modal-footer">
      <span class="footer-left">ДПС України</span>
      <span class="footer-right">KaderGo</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
